    <main>
        <div class="container">
            
       
        <h2>USERS PERSONAL DETAILS</h2>

  <form action="feedback.html" method="GET">
  <label for="fname">First Name</label>
  <input type="text" id="fname" name="firstname" placeholder="Your name..">

  <label for="lname">Last Name</label>
  <input type="text" id="lname" name="lastname" placeholder="Your last name..">

  <label for="cnumber">Contact</label>
  <input type="text" id="cnumber" name="Contactnumber" placeholder="Your Contact number">

  <label for="eaddress">Email Address</label> 
  <input type="email" id="email" name="email" placeholder="Your Email Address">

   <label for="password">Enter your password</label>
   <input type="text" id="Pword" name="Password"  placeholder="Your Password" required >

   <label for="confirmPassword">Confirm your password</label>
   <input type="text" id="cPassword" name="confirmPass" placeholder="Confirm Password" required > 

  <div class="mb-3">
    <label for="dofbirth">Date of Birth:</label>
    <input type="date" class="form-control" placeholder="Date of Birth" id="dofbirth" name="dofbirth" max="2008-01-01">
    <div class="invalid-feedback">Booking is reserved for individuals aged 18 or more!</div>
  </div>
           
  <label for="address">Enter your Address:</label>
  <textarea id="address" name="address" placeholder="Your Address" rows="3" required></textarea>

  <label for="dob">Booking Reservations:</label>
  <input type="date" id="dob" name="dob" placeholder="Booking Reservations" required >
   
  <label for="interest">I am Interested in</label>
  <select id="interest" name="I am Interested in">
    <option value="Guest House">Guest house</option>
    <option value="Buy">Buy</option>
    <option value="Rent to buy">Rent to buy</option>
    <option value="Rental">Rental</option>
  </select>
  
  
   <button type="submit" class="btn btn-primary">
    BOOKING CONFIRMATION
</button>
