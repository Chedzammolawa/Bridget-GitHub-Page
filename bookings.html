    <main>
       <form>
        <fieldset>
            <legend>User Personal Information</legend>
            <label for="name">Enter first name:</label>
            <input type="text" id="fname" name="fname" required />
            <label for="lname">Enter last name:</label> 
            <input type="text" id="lname" name="lname" required />
            <label for="email">Enter your email:</label>
            <input type="email" id="email" name="email" required />
            <label for="password">Enter your password:</label>
            <input type="password" id="password" name="pass" required />
            <label for="confirmPassword">Confirm your password:</label>
            <input type="password" id="confirmPassword" name="confirmPass" required />
            <label for="contact"> Enter your Contact :</label>
            <input type="contact" id="Contact" name="Contact" required />
            <label for="dob">Enter your Date of Birth:</label>
            <input type="date" id="dob" name="dob" max="2008-03-09" required />
            <label for="address">Enter your Address:</label>
            <textarea id="address" name="address" required></textarea>

            <label for="interest">I am Interested in:</label>
            <input type="radio" id="Rent to buy" name="Interest" value="Rent to buy">
            <label for="Rent to buy">Rent to buy</label><br>
            <input type="radio" id="Rental" name="Interest" value="Rental">
            <label for="Rental">Rental</label><br>
            <input type="radio" id="Guest House" name="Interest" value="Guest House">
            <label for="Guest House">Guest House</label><br>
            <input type="radio" id="Buy" name="Interest" value="Buy" >
            <label for="Buy">Buy</label><br>

            <label for="dob">Book reservations:</label>
            <input type="date" id="dob" name="dob" required />
        </fieldset>
            <input type="submit" value="Submit" />
            <form onsubmit="alert('Thank you! Your inquiry has been submitted successfully.');">
        </fieldset>
    </form>
